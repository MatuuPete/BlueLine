name: Ingest

# Cron is UTC. Times below are chosen for EST (UTC-5), i.e. the NBA regular
# season. During EDT (UTC-4, roughly early Oct and Apr) every job fires one
# hour earlier in ET than the spec; see docs/RUNBOOK.md.
on:
  schedule:
    - cron: "0 11 * * *" # 06:00 ET boxscores -> precompute -> grade-slips
    - cron: "15 11 * * *" # 06:15 ET schedule
    - cron: "0 15-23,0-4 * * *" # 10:00-23:00 ET injuries (hourly)
    - cron: "0 17,19,21,23 * * *" # 12:00,14:00,16:00,18:00 ET odds (every 2h)
    - cron: "*/15 22,23,0-3 * * *" # 17:00-22:45 ET closing odds (every 15 min)
    - cron: "0,15,30,45 4 * * *" # 23:00-23:45 ET closing odds
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        type: choice
        options:
          - daily
          - schedule
          - injuries
          - odds
          - odds-closing
      date:
        description: Optional date override (YYYY-MM-DD), daily/schedule only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_JOB: ${{ inputs.job }}
      INPUT_DATE: ${{ inputs.date }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Map schedule to job
        id: job
        run: |
          job="$INPUT_JOB"
          if [ -z "$job" ]; then
            case "$EVENT_SCHEDULE" in
              "0 11 * * *") job=daily ;;
              "15 11 * * *") job=schedule ;;
              "0 15-23,0-4 * * *") job=injuries ;;
              "0 17,19,21,23 * * *") job=odds ;;
              "*/15 22,23,0-3 * * *" | "0,15,30,45 4 * * *") job=odds-closing ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
            esac
          fi
          if [ -n "$INPUT_DATE" ] && ! printf '%s' "$INPUT_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid date: $INPUT_DATE" >&2; exit 1
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "Running job: $job"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_PROVIDER: ${{ secrets.ODDS_PROVIDER }}
          ODDS_MONTHLY_BUDGET: ${{ secrets.ODDS_MONTHLY_BUDGET }}
          JOB: ${{ steps.job.outputs.job }}
        run: |
          date_args=()
          if [ -n "$INPUT_DATE" ]; then date_args=(--date "$INPUT_DATE"); fi
          case "$JOB" in
            daily)
              pnpm worker ingest:boxscores "${date_args[@]}"
              pnpm worker precompute "${date_args[@]}"
              pnpm worker grade-slips
              ;;
            schedule)
              pnpm worker ingest:schedule "${date_args[@]}"
              ;;
            injuries)
              pnpm worker ingest:injuries
              pnpm worker precompute --incremental
              ;;
            odds)
              pnpm worker ingest:odds
              pnpm worker precompute --incremental
              ;;
            odds-closing)
              pnpm worker ingest:odds --closing
              pnpm worker precompute --incremental
              ;;
            *) echo "Unknown job: $JOB" >&2; exit 1 ;;
          esac
