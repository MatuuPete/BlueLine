name: Backup

on:
  schedule:
    - cron: '0 8 * * 0' # Sunday 03:00 EST / 04:00 EDT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

env:
  # Must be >= the Neon server major version (pg_dump refuses newer servers).
  PG_MAJOR: '17'

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Quiet skip until the repo secrets exist (docs/DEPLOY.md), so scheduled runs do not fail.
      - name: Check required secrets
        id: gate
        env:
          HAS_DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT != '' }}
          HAS_BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE != '' }}
        run: |
          missing=""
          [ "$HAS_DATABASE_URL_DIRECT" = "true" ] || missing="$missing DATABASE_URL_DIRECT"
          [ "$HAS_BACKUP_PASSPHRASE" = "true" ] || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::notice::Skipping backup; missing secret(s):$missing. See docs/DEPLOY.md."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install PostgreSQL client (PGDG)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          fprs=$(gpg --show-keys --with-colons "$key")
          if ! grep -q '^fpr:::::::::B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8:' <<<"$fprs"; then
            echo "PGDG signing key fingerprint mismatch" >&2; exit 1
          fi
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-$PG_MAJOR"
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" --version
      - name: Dump and encrypt database
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "BACKUP_PASSPHRASE secret is missing; refusing to upload an unencrypted dump" >&2
            exit 1
          fi
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" --format=custom --no-owner --no-privileges --file "blueline-$stamp.dump" "$DATABASE_URL"
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_restore" --list "blueline-$stamp.dump" > /dev/null
          # Passphrase on stdin (fd 0), never on the command line.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 0 --output "blueline-$stamp.dump.gpg" "blueline-$stamp.dump"
          shred -u "blueline-$stamp.dump" || rm -f "blueline-$stamp.dump"
          ls -l blueline-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.run == 'true'
        with:
          name: blueline-pg-dump
          path: blueline-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
